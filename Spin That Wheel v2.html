<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur Daily Scrum</title>
  <style>
    :root {
      --primary: #0078d4;
      --primary-dark: #005ea2;
      --background: #f4f9ff;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-radius: 8px;
      --indispo-bg: #fff8f0;
      --indispo-border: #f0c070;
      --indispo-tag-bg: #fff0d0;
      --indispo-tag-border: #e0a030;
      --excl-bg: #f0f7ff;
      --excl-border: #b0d0f0;
      --excl-tag-bg: #ddeeff;
      --excl-tag-border: #80b8e8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background-color: var(--background);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 2em;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.5em;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 2em;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 0.5em;
      display: flex;
      align-items: center;
      gap: 0.5em;
      font-size: 1.8em;
    }

    h2 {
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 0.5em;
    }

    label {
      margin-right: 0.5em;
    }

    button {
      margin-top: 1em;
      padding: 0.8em 1.2em;
      font-size: 1em;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
    }
    button:hover { background-color: var(--primary-dark); }
    button:active { transform: translateY(1px); }

    /* Options row */
    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2em;
      align-items: center;
      margin-top: 0.8em;
    }
    .options-row label {
      font-size: 0.9em;
      margin-right: 0;
    }
    .options-row .date-group {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }
    .options-row input[type="date"] {
      padding: 0.4em 0.6em;
      border: 1px solid #ccd4e0;
      border-radius: var(--border-radius);
      font-size: 0.9em;
      background-color: #f9fbfe;
      font-family: inherit;
    }

    /* Section exclusions groupe */
    .group-excl-toggle {
      margin-top: 0.9em;
      display: flex;
      align-items: center;
      gap: 0.5em;
      cursor: pointer;
      user-select: none;
      width: fit-content;
    }
    .group-excl-toggle-label {
      font-size: 0.88em;
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline dotted;
    }
    .group-excl-toggle-badge {
      display: inline-block;
      background-color: var(--primary);
      color: #fff;
      font-size: 0.68em;
      font-weight: 700;
      padding: 0.1em 0.45em;
      border-radius: 10px;
      vertical-align: middle;
    }
    .group-excl-arrow {
      font-size: 0.75em;
      color: var(--primary);
      transition: transform 0.15s;
    }
    .group-excl-arrow.open { transform: rotate(90deg); }

    .group-excl-panel {
      display: none;
      margin-top: 0.6em;
      background-color: var(--excl-bg);
      border: 1px solid var(--excl-border);
      border-radius: var(--border-radius);
      padding: 0.8em 1em;
    }
    .group-excl-panel.open { display: block; }

    .group-excl-panel-title {
      font-size: 0.82em;
      font-weight: 600;
      color: #2060a0;
      margin-bottom: 0.6em;
    }

    .group-excl-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      align-items: center;
      margin-bottom: 0.7em;
    }
    .group-excl-form label {
      font-size: 0.82em;
      color: #444;
      margin-right: 0;
    }
    .group-excl-form select,
    .group-excl-form input[type="number"],
    .group-excl-form input[type="date"] {
      padding: 0.35em 0.5em;
      border: 1px solid #a0c0e0;
      border-radius: 5px;
      font-size: 0.85em;
      background-color: #f5faff;
      font-family: inherit;
    }
    .group-excl-form input[type="number"] { width: 4em; }
    .group-excl-form button {
      margin-top: 0;
      padding: 0.35em 0.8em;
      font-size: 0.85em;
      background-color: var(--primary);
    }
    .group-excl-form button:hover { background-color: var(--primary-dark); }

    .group-excl-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em;
    }
    .group-excl-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      background-color: var(--excl-tag-bg);
      border: 1px solid var(--excl-tag-border);
      border-radius: 4px;
      padding: 0.2em 0.5em;
      font-size: 0.8em;
      color: #1a4a7a;
    }
    .group-excl-tag button {
      margin-top: 0;
      padding: 0;
      background: none;
      color: #1a5090;
      font-size: 0.9em;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
    .group-excl-tag button:hover { color: #c82333; background: none; }
    .group-excl-empty {
      font-size: 0.82em;
      color: #999;
      font-style: italic;
    }

    /* Tableau participants */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1em;
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    th, td {
      padding: 0.8em;
      text-align: left;
    }
    th {
      background-color: var(--primary);
      color: #ffffff;
    }
    tbody tr:nth-child(even):not(.indispo-row) { background-color: #f7faff; }
    tbody tr:nth-child(odd):not(.indispo-row)  { background-color: #ffffff; }

    .participants-table th { background-color: var(--primary-dark); }
    .participants-table td {
      padding: 0.6em;
      vertical-align: middle;
    }
    .participants-table td:first-child { width: 40%; }

    .inactive td {
      opacity: 0.6;
      text-decoration: line-through;
    }
    .inactive.indispo-row td { text-decoration: none; }

    /* Ajout participant */
    .add-person {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.4em;
      flex-wrap: wrap;
    }
    .add-person input[type="text"] {
      flex: 1;
      padding: 0.6em;
      border: 1px solid #ccd4e0;
      border-radius: var(--border-radius);
      background-color: #f9fbfe;
      font-size: 1em;
    }
    .add-person button {
      margin-top: 0;
      padding: 0.6em 1.2em;
    }
    .add-person-hint {
      font-size: 0.78em;
      color: #888;
      margin-bottom: 0.8em;
    }

    /* Badge indispos sur la ligne */
    .indispo-badge {
      display: inline-block;
      background-color: #f59e0b;
      color: #fff;
      font-size: 0.7em;
      font-weight: 700;
      padding: 0.15em 0.45em;
      border-radius: 10px;
      vertical-align: middle;
      margin-left: 0.4em;
      letter-spacing: 0.02em;
    }

    /* Boutons d'action */
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
      margin-right: 0.3em;
      padding: 0.2em;
    }
    .action-btn.edit-btn:hover   { color: var(--primary); }
    .action-btn.delete-btn:hover { color: #c82333; }
    .action-btn.indispo-btn { font-size: 1em; }
    .action-btn.indispo-btn:hover { color: #d07000; }

    /* Panneau indispos inline */
    .indispo-row td {
      padding: 0;
      background-color: var(--indispo-bg) !important;
    }
    .indispo-panel {
      padding: 0.8em 1em;
      border-top: 1px solid var(--indispo-border);
      border-bottom: 1px solid var(--indispo-border);
    }
    .indispo-panel-title {
      font-weight: 600;
      font-size: 0.85em;
      color: #a06000;
      margin-bottom: 0.6em;
    }

    .indispo-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      align-items: center;
      margin-bottom: 0.7em;
    }
    .indispo-form label {
      font-size: 0.82em;
      color: #555;
      margin-right: 0;
    }
    .indispo-form input[type="date"] {
      padding: 0.35em 0.5em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.85em;
      background-color: #fffdf7;
      font-family: inherit;
    }
    .indispo-form select {
      padding: 0.35em 0.5em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.85em;
      background-color: #fffdf7;
      font-family: inherit;
    }
    .indispo-form button {
      margin-top: 0;
      padding: 0.35em 0.8em;
      font-size: 0.85em;
      background-color: #e08010;
    }
    .indispo-form button:hover { background-color: #b86000; }

    .indispo-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em;
    }
    .indispo-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      background-color: var(--indispo-tag-bg);
      border: 1px solid var(--indispo-tag-border);
      border-radius: 4px;
      padding: 0.2em 0.5em;
      font-size: 0.8em;
      color: #7a4a00;
    }
    .indispo-tag button {
      margin-top: 0;
      padding: 0;
      background: none;
      color: #a06000;
      font-size: 0.9em;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
    .indispo-tag button:hover { color: #c82333; background: none; }
    .indispo-empty {
      font-size: 0.82em;
      color: #999;
      font-style: italic;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.4em; }
      button { width: 100%; justify-content: center; }
      .options-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1><span aria-hidden="true">🔀</span> Sélection Daily Scrum</h1>

      <div class="add-person">
        <input type="text" id="newName" placeholder="Ajouter un ou plusieurs participants…">
        <button id="addButton">Ajouter</button>
      </div>
      <div class="add-person-hint">Plusieurs noms ? Séparez-les par une virgule ou un point-virgule.</div>

      <table id="participantsTable" class="participants-table">
        <thead>
          <tr><th>Nom</th><th>Actif</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="options-row">
        <div>
          <input type="checkbox" id="skipWeekends" checked>
          <label for="skipWeekends">Ignorer les week‑ends</label>
        </div>
        <div class="date-group">
          <label for="startDate">Date de début :</label>
          <input type="date" id="startDate">
        </div>
      </div>

      <!-- Section exclusions groupe (collapsible) -->
      <div class="group-excl-toggle" id="groupExclToggle">
        <span class="group-excl-arrow" id="groupExclArrow">▶</span>
        <span class="group-excl-toggle-label">Jours exclus (groupe)</span>
        <span class="group-excl-toggle-badge" id="groupExclBadge" style="display:none;"></span>
      </div>
      <div class="group-excl-panel" id="groupExclPanel">
        <div class="group-excl-panel-title">
          Définir des jours récurrents à ignorer pour tout le groupe (ex : chaque 2ᵉ mardi à partir d'une date de référence)
        </div>
        <div class="group-excl-form" id="groupExclForm">
          <label>Jour :</label>
          <select id="exclDayOfWeek">
            <option value="1">Lundi</option>
            <option value="2" selected>Mardi</option>
            <option value="3">Mercredi</option>
            <option value="4">Jeudi</option>
            <option value="5">Vendredi</option>
            <option value="6">Samedi</option>
            <option value="0">Dimanche</option>
          </select>
          <label>toutes les</label>
          <input type="number" id="exclEveryN" value="2" min="1" max="52">
          <label>semaine(s) — à partir du</label>
          <input type="date" id="exclRefDate">
          <button id="exclAddBtn">+ Ajouter</button>
        </div>
        <div class="group-excl-tags" id="groupExclTags"></div>
      </div>

      <button id="selectButton"><span aria-hidden="true">🎲</span> Lancer la sélection</button>
    </div>

    <div id="scheduleArea">
      <h2 id="scheduleTitle" style="display:none;">Planning généré :</h2>
      <div id="schedule"></div>
    </div>
  </div>

  <script>
    // ─── Utilitaires ─────────────────────────────────────────────────────────────

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function toYMD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseYMD(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function isWeekend(date) {
      const day = date.getDay();
      return day === 0 || day === 6;
    }

    function nextBusinessDate(date, skipWeekends) {
      const next = new Date(date);
      do { next.setDate(next.getDate() + 1); }
      while (skipWeekends && isWeekend(next));
      return next;
    }

    function formatDateFr(date) {
      return date.toLocaleDateString('fr-FR', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    // Noms courts des jours pour affichage dans les tags
    const DAY_NAMES = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

    // ─── Vérification indispo individuelle ───────────────────────────────────────

    function isDateIndispo(date, indispos) {
      const ymd = toYMD(date);
      return indispos.some(ind => {
        if (ind.type === 'day')   return ind.date1 === ymd;
        if (ind.type === 'range') return ymd >= ind.date1 && ymd <= ind.date2;
        return false;
      });
    }

    // ─── Vérification exclusion groupe (récurrence alternée) ─────────────────────
    //
    // Une règle groupe = { dayOfWeek: 2, everyN: 2, refDate: "2025-03-04" }
    // Une date est exclue si :
    //   - son jour de semaine correspond à dayOfWeek
    //   - le nombre de semaines écoulées depuis refDate est un multiple de everyN
    //     (i.e. Math.floor(diffJours / 7) % everyN === 0)

    function isDateGroupExcluded(date, rules) {
      if (!rules || rules.length === 0) return false;
      const dow = date.getDay();
      return rules.some(rule => {
        if (dow !== rule.dayOfWeek) return false;
        const ref = parseYMD(rule.refDate);
        const diffMs = date.getTime() - ref.getTime();
        const diffDays = Math.round(diffMs / 86400000);
        if (diffDays < 0) return false; // avant la date de référence : non concerné
        const weeksSinceRef = Math.floor(diffDays / 7);
        return weeksSinceRef % rule.everyN === 0;
      });
    }

    // ─── Données participants ─────────────────────────────────────────────────────

    let participants = [];

    function loadParticipants() {
      try {
        const stored = localStorage.getItem('participants');
        if (stored) participants = JSON.parse(stored);
      } catch (e) { participants = []; }
    }

    function saveParticipants() {
      localStorage.setItem('participants', JSON.stringify(participants));
    }

    // ─── Données exclusions groupe ────────────────────────────────────────────────

    let groupExclusions = [];

    function loadGroupExclusions() {
      try {
        const stored = localStorage.getItem('groupExclusions');
        if (stored) groupExclusions = JSON.parse(stored);
      } catch (e) { groupExclusions = []; }
    }

    function saveGroupExclusions() {
      localStorage.setItem('groupExclusions', JSON.stringify(groupExclusions));
    }

    // ─── Rendu exclusions groupe ──────────────────────────────────────────────────

    function renderGroupExclusions() {
      const tagsDiv = document.getElementById('groupExclTags');
      const badge   = document.getElementById('groupExclBadge');
      tagsDiv.innerHTML = '';

      if (groupExclusions.length === 0) {
        badge.style.display = 'none';
        const empty = document.createElement('span');
        empty.className = 'group-excl-empty';
        empty.textContent = 'Aucune règle définie.';
        tagsDiv.appendChild(empty);
        return;
      }

      badge.style.display = '';
      badge.textContent = groupExclusions.length;

      groupExclusions.forEach((rule, idx) => {
        const tag = document.createElement('span');
        tag.className = 'group-excl-tag';

        const dayName = DAY_NAMES[rule.dayOfWeek];
        const freq = rule.everyN === 1 ? 'chaque' : `1 sur ${rule.everyN}`;
        const label = `${freq} ${dayName} (réf. ${formatDateFr(parseYMD(rule.refDate))})`;
        tag.appendChild(document.createTextNode(label + ' '));

        const removeBtn = document.createElement('button');
        removeBtn.textContent = '✕';
        removeBtn.title = 'Supprimer cette règle';
        removeBtn.addEventListener('click', () => {
          groupExclusions.splice(idx, 1);
          saveGroupExclusions();
          renderGroupExclusions();
        });
        tag.appendChild(removeBtn);
        tagsDiv.appendChild(tag);
      });
    }

    // ─── Collapsible exclusions groupe ───────────────────────────────────────────

    let groupExclOpen = false;

    document.getElementById('groupExclToggle').addEventListener('click', () => {
      groupExclOpen = !groupExclOpen;
      document.getElementById('groupExclPanel').classList.toggle('open', groupExclOpen);
      document.getElementById('groupExclArrow').classList.toggle('open', groupExclOpen);
    });

    document.getElementById('exclAddBtn').addEventListener('click', () => {
      const dow    = parseInt(document.getElementById('exclDayOfWeek').value, 10);
      const everyN = parseInt(document.getElementById('exclEveryN').value, 10);
      const ref    = document.getElementById('exclRefDate').value;

      if (!ref) { alert('Veuillez saisir une date de référence.'); return; }
      if (isNaN(everyN) || everyN < 1) { alert('La fréquence doit être ≥ 1.'); return; }

      // La date de référence doit être un jour qui correspond au dayOfWeek choisi
      const refDate = parseYMD(ref);
      if (refDate.getDay() !== dow) {
        const dayName = DAY_NAMES[dow];
        alert(`La date de référence doit être un ${dayName} (pour définir quelle occurrence est exclue).`);
        return;
      }

      groupExclusions.push({ dayOfWeek: dow, everyN, refDate: ref });
      saveGroupExclusions();
      renderGroupExclusions();
      document.getElementById('exclRefDate').value = '';
    });

    // ─── Rendu tableau participants ───────────────────────────────────────────────

    const openIndispoPanels = new Set();

    function renderParticipants() {
      const tbody = document.querySelector('#participantsTable tbody');
      tbody.innerHTML = '';

      participants.forEach((participant) => {
        const tr = document.createElement('tr');
        if (!participant.active) tr.classList.add('inactive');

        // Nom + badge indispos
        const nameTd = document.createElement('td');
        const nameSpan = document.createElement('span');
        nameSpan.textContent = participant.name;
        nameTd.appendChild(nameSpan);
        const indispoCount = (participant.indispos || []).length;
        if (indispoCount > 0) {
          const badge = document.createElement('span');
          badge.className = 'indispo-badge';
          badge.title = `${indispoCount} indisponibilité${indispoCount > 1 ? 's' : ''} enregistrée${indispoCount > 1 ? 's' : ''}`;
          badge.textContent = `${indispoCount} indispo${indispoCount > 1 ? 's' : ''}`;
          nameTd.appendChild(badge);
        }

        // Statut actif
        const activeTd = document.createElement('td');
        const toggle = document.createElement('input');
        toggle.type = 'checkbox';
        toggle.checked = participant.active;
        toggle.addEventListener('change', () => {
          participant.active = toggle.checked;
          saveParticipants();
          renderParticipants();
        });
        activeTd.appendChild(toggle);

        // Actions
        const actionsTd = document.createElement('td');

        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn edit-btn';
        editBtn.title = 'Modifier le nom';
        editBtn.textContent = '✏️';
        editBtn.addEventListener('click', () => {
          const nouveauNom = prompt('Modifier le nom :', participant.name);
          if (nouveauNom !== null) {
            const trimmed = nouveauNom.trim();
            if (trimmed.length > 0) {
              participant.name = trimmed;
              saveParticipants();
              renderParticipants();
            }
          }
        });

        const indispoBtn = document.createElement('button');
        indispoBtn.className = 'action-btn indispo-btn';
        indispoBtn.title = 'Gérer les indisponibilités';
        indispoBtn.textContent = '📅';
        indispoBtn.addEventListener('click', () => {
          if (openIndispoPanels.has(participant.id)) {
            openIndispoPanels.delete(participant.id);
          } else {
            openIndispoPanels.add(participant.id);
          }
          renderParticipants();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'action-btn delete-btn';
        deleteBtn.title = 'Supprimer le participant';
        deleteBtn.textContent = '🗑️';
        deleteBtn.addEventListener('click', () => {
          if (confirm('Supprimer ce participant ?')) {
            participants = participants.filter(p => p.id !== participant.id);
            openIndispoPanels.delete(participant.id);
            saveParticipants();
            renderParticipants();
          }
        });

        actionsTd.appendChild(editBtn);
        actionsTd.appendChild(indispoBtn);
        actionsTd.appendChild(deleteBtn);

        tr.appendChild(nameTd);
        tr.appendChild(activeTd);
        tr.appendChild(actionsTd);
        tbody.appendChild(tr);

        // Panneau indispo inline
        if (openIndispoPanels.has(participant.id)) {
          const indispoTr = document.createElement('tr');
          indispoTr.className = 'indispo-row';
          if (!participant.active) indispoTr.classList.add('inactive');
          const indispoTd = document.createElement('td');
          indispoTd.colSpan = 3;
          indispoTd.appendChild(buildIndispoPanel(participant));
          indispoTr.appendChild(indispoTd);
          tbody.appendChild(indispoTr);
        }
      });
    }

    function buildIndispoPanel(participant) {
      if (!participant.indispos) participant.indispos = [];

      const panel = document.createElement('div');
      panel.className = 'indispo-panel';

      const title = document.createElement('div');
      title.className = 'indispo-panel-title';
      title.textContent = `Indisponibilités de ${participant.name}`;
      panel.appendChild(title);

      const form = document.createElement('div');
      form.className = 'indispo-form';

      const typeLabel = document.createElement('label');
      typeLabel.textContent = 'Type :';
      const typeSelect = document.createElement('select');
      typeSelect.innerHTML = '<option value="day">Jour isolé</option><option value="range">Plage</option>';

      const date1Label = document.createElement('label');
      const date1Input = document.createElement('input');
      date1Input.type = 'date';

      const date2Label = document.createElement('label');
      date2Label.textContent = 'au :';
      const date2Input = document.createElement('input');
      date2Input.type = 'date';

      function updateDateFields() {
        const isRange = typeSelect.value === 'range';
        date2Label.style.display = isRange ? '' : 'none';
        date2Input.style.display = isRange ? '' : 'none';
        date1Label.textContent = isRange ? 'Du :' : 'Date :';
      }
      typeSelect.addEventListener('change', updateDateFields);
      updateDateFields();

      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Ajouter';
      addBtn.addEventListener('click', () => {
        const type = typeSelect.value;
        const d1 = date1Input.value;
        const d2 = date2Input.value;
        if (!d1) { alert('Veuillez saisir une date.'); return; }
        if (type === 'range') {
          if (!d2) { alert('Veuillez saisir la date de fin.'); return; }
          if (d2 < d1) { alert('La date de fin doit être après la date de début.'); return; }
          participant.indispos.push({ type: 'range', date1: d1, date2: d2 });
        } else {
          if (participant.indispos.some(i => i.type === 'day' && i.date1 === d1)) {
            alert('Ce jour est déjà ajouté.'); return;
          }
          participant.indispos.push({ type: 'day', date1: d1 });
        }
        date1Input.value = '';
        date2Input.value = '';
        saveParticipants();
        renderParticipants();
      });

      form.appendChild(typeLabel);
      form.appendChild(typeSelect);
      form.appendChild(date1Label);
      form.appendChild(date1Input);
      form.appendChild(date2Label);
      form.appendChild(date2Input);
      form.appendChild(addBtn);
      panel.appendChild(form);

      const tagsDiv = document.createElement('div');
      tagsDiv.className = 'indispo-tags';

      if (participant.indispos.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'indispo-empty';
        empty.textContent = 'Aucune indisponibilité enregistrée.';
        tagsDiv.appendChild(empty);
      } else {
        const sorted = [...participant.indispos].sort((a, b) => a.date1.localeCompare(b.date1));
        sorted.forEach(ind => {
          const tag = document.createElement('span');
          tag.className = 'indispo-tag';
          const label = ind.type === 'day'
            ? formatDateFr(parseYMD(ind.date1))
            : `${formatDateFr(parseYMD(ind.date1))} → ${formatDateFr(parseYMD(ind.date2))}`;
          tag.appendChild(document.createTextNode(label + ' '));
          const removeBtn = document.createElement('button');
          removeBtn.textContent = '✕';
          removeBtn.title = 'Supprimer cette indisponibilité';
          removeBtn.addEventListener('click', () => {
            participant.indispos = participant.indispos.filter(i => i !== ind);
            saveParticipants();
            renderParticipants();
          });
          tag.appendChild(removeBtn);
          tagsDiv.appendChild(tag);
        });
      }

      panel.appendChild(tagsDiv);
      return panel;
    }

    // ─── Ajout participant ────────────────────────────────────────────────────────

    document.getElementById('addButton').addEventListener('click', () => {
      const input = document.getElementById('newName');
      const raw = input.value.trim();
      if (raw === '') { alert('Veuillez saisir un nom.'); return; }
      const names = raw.split(/[,;]+/).map(n => n.trim()).filter(n => n.length > 0);
      names.forEach(name => {
        participants.push({ id: Date.now() + Math.random(), name, active: true, indispos: [] });
      });
      saveParticipants();
      input.value = '';
      renderParticipants();
    });

    document.getElementById('newName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addButton').click(); }
    });

    // ─── Date de début ────────────────────────────────────────────────────────────

    function initStartDate() {
      const input = document.getElementById('startDate');
      if (!input.value) input.value = toYMD(new Date());
    }

    // ─── Génération du planning ───────────────────────────────────────────────────

    document.getElementById('selectButton').addEventListener('click', () => {
      const skipWeekends = document.getElementById('skipWeekends').checked;
      const scheduleDiv   = document.getElementById('schedule');
      const scheduleTitle = document.getElementById('scheduleTitle');
      scheduleDiv.innerHTML = '';
      scheduleTitle.style.display = 'none';

      const activeParticipants = participants.filter(p => p.active);
      if (activeParticipants.length === 0) {
        alert('Aucun participant actif à planifier.');
        return;
      }

      const startDateVal = document.getElementById('startDate').value;
      let startDate = startDateVal ? parseYMD(startDateVal) : new Date();

      // Avancer si le jour de départ est un week-end ou exclu groupe
      const limit0 = new Date(startDate);
      limit0.setFullYear(limit0.getFullYear() + 1);
      while (startDate <= limit0) {
        if (skipWeekends && isWeekend(startDate)) { startDate.setDate(startDate.getDate() + 1); continue; }
        if (isDateGroupExcluded(startDate, groupExclusions)) { startDate.setDate(startDate.getDate() + 1); continue; }
        break;
      }

      const shuffled = [...activeParticipants];
      shuffle(shuffled);

      const rows = [];
      let currentDate = new Date(startDate);

      for (const participant of shuffled) {
        let candidate = new Date(currentDate);
        const limit = new Date(currentDate);
        limit.setFullYear(limit.getFullYear() + 1);

        let found = false;
        while (candidate <= limit) {
          if (skipWeekends && isWeekend(candidate)) {
            candidate.setDate(candidate.getDate() + 1); continue;
          }
          if (isDateGroupExcluded(candidate, groupExclusions)) {
            candidate.setDate(candidate.getDate() + 1); continue;
          }
          if (isDateIndispo(candidate, participant.indispos || [])) {
            candidate.setDate(candidate.getDate() + 1); continue;
          }
          found = true;
          break;
        }

        if (!found) continue;

        rows.push({ date: new Date(candidate), name: participant.name });

        // Avancer au prochain jour dispo (hors week-end et hors exclusions groupe)
        let next = new Date(candidate);
        const limitNext = new Date(candidate);
        limitNext.setFullYear(limitNext.getFullYear() + 1);
        do {
          next.setDate(next.getDate() + 1);
        } while (next <= limitNext && (
          (skipWeekends && isWeekend(next)) ||
          isDateGroupExcluded(next, groupExclusions)
        ));
        currentDate = next;
      }

      if (rows.length === 0) {
        scheduleDiv.innerHTML = '<p style="color:#999;font-style:italic;">Aucun participant disponible sur la période.</p>';
        scheduleTitle.style.display = '';
        return;
      }

      let html = '<table class="planning-table"><thead><tr><th>Date</th><th>Personne</th></tr></thead><tbody>';
      rows.forEach(row => {
        html += `<tr><td>${formatDateFr(row.date)}</td><td>${row.name}</td></tr>`;
      });
      html += '</tbody></table>';

      const excluded = activeParticipants.filter(p => !rows.find(r => r.name === p.name));
      if (excluded.length > 0) {
        const names = excluded.map(p => p.name).join(', ');
        html += `<p style="margin-top:0.8em;font-size:0.88em;color:#a06000;">⚠️ Exclus (aucun jour dispo) : <strong>${names}</strong></p>`;
      }

      scheduleDiv.innerHTML = html;
      scheduleTitle.style.display = '';
    });

    // ─── Init ─────────────────────────────────────────────────────────────────────

    loadParticipants();
    loadGroupExclusions();
    renderParticipants();
    renderGroupExclusions();
    initStartDate();
  </script>
</body>
</html>
